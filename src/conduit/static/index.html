<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>rás</title>
  <link rel="stylesheet" href="/assets/app.css">
  <!-- The mark, flattened to literal colours: a data URI cannot read CSS vars. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230e1014'/%3E%3Cg%20fill='none'%20stroke-width='2.6'%20stroke-linecap='round'%3E%3Cpath%20d='M6%209C13%209%2015%2016%2022%2016'%20stroke='%2322d3ee'/%3E%3Cpath%20d='M6%2016h16'%20stroke='%234f8cff'/%3E%3Cpath%20d='M6%2023C13%2023%2015%2016%2022%2016'%20stroke='%2322d3ee'/%3E%3C/g%3E%3Ccircle%20cx='24'%20cy='16'%20r='2.8'%20fill='%234f8cff'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app" class="app">
    <aside class="rail" id="rail">
      <div class="rail__brand">
        <!-- rás: three streams merging into one channel. Many trackers, one pipeline. -->
        <svg viewBox="0 0 32 32" aria-hidden="true" fill="none">
          <g stroke-width="2.6" stroke-linecap="round">
            <path class="mark__stream" d="M6 9C13 9 15 16 22 16"/>
            <path class="mark__stream mark__stream--mid" d="M6 16h16"/>
            <path class="mark__stream" d="M6 23C13 23 15 16 22 16"/>
          </g>
          <circle class="mark__core" cx="24" cy="16" r="2.8"/>
        </svg>
        <div>
          <div class="rail__wordmark">rás</div>
          <span class="rail__tag">media pipeline</span>
        </div>
      </div>
      <nav class="rail__nav" id="nav"></nav>
      <div class="rail__foot">
        <button class="iconbtn" id="theme-toggle" title="Switch theme" aria-label="Switch theme">◐</button>
        <span class="rail__version" id="version"></span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="iconbtn topbar__menu" id="menu-toggle" aria-label="Menu">☰</button>
        <h1 class="topbar__title" id="page-title">Dashboard</h1>
        <div class="topbar__status" id="status-strip"></div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true">
      <header class="modal__head">
        <h2 id="modal-title"></h2>
        <button class="iconbtn" data-close aria-label="Close">✕</button>
      </header>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
